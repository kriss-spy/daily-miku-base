[project]
name = "daily-miku-base"
version = "0.1.0"
description = "Multi-functional server/website for daily Miku images from raindrop.io"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.115.14",
    "email-validator==2.2.0",
    "jinja2==3.1.2",
    "python-dotenv==1.0.0",
    "requests==2.31.0",
    "uvicorn==0.24.0",
    "mangum==0.17.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.1.0",
    "psycopg[binary,pool]==3.2.9",
    "namecheap-python>=0.2.3",
    "httpx==0.27.2",
    "pillow>=10.4.0,<12.0.0",
    "vercel==0.5.9",
]

[project.scripts]
daily-miku = "daily_miku.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "requests-mock>=1.11.0",
    "httpx==0.27.2",  # compatible with Starlette TestClient and the Vercel SDK
    "respx>=0.20.0",  # for mocking httpx requests
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daily_miku"]
