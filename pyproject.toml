[project]
name = "daily-miku-base"
version = "0.1.0"
description = "Multi-functional server/website for daily Miku images from raindrop.io"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.104.1",
    "jinja2==3.1.2",
    "python-dotenv==1.0.0",
    "requests==2.31.0",
    "uvicorn==0.24.0",
    "mangum==0.17.0",
    "pydantic==2.5.3",
]

[project.scripts]
daily-miku = "daily_miku.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "requests-mock>=1.11.0",
    "httpx>=0.27.0",  # for FastAPI TestClient
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daily_miku"]
