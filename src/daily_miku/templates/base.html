<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Daily Miku{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #9945ff;
            --primary-dark: #7c3aed;
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        body {
            background: linear-gradient(135deg, var(--bg) 0%, #1a1f3a 100%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 2rem;
        }

        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--primary) 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .content {
            display: grid;
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .image-container {
            text-align: center;
            background: var(--surface);
            border-radius: 12px;
            padding: 2rem;
            border: 1px solid var(--border);
        }

        .image-container img {
            max-width: 100%;
            max-height: 600px;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(153, 69, 255, 0.2);
        }

        .metadata {
            background: var(--surface);
            border-radius: 12px;
            padding: 2rem;
            border: 1px solid var(--border);
            margin: 0 auto;
            max-width: 600px;
        }

        .metadata h2 {
            font-size: 1.75rem;
            margin-bottom: 1rem;
            color: var(--primary);
        }

        .metadata-item {
            margin-bottom: 1.5rem;
        }

        .metadata-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .metadata-value {
            color: var(--text);
            font-size: 1rem;
            word-break: break-word;
        }

        .metadata-value a {
            color: var(--primary);
            text-decoration: none;
            border-bottom: 1px solid rgba(153, 69, 255, 0.3);
            transition: all 0.2s;
        }

        .metadata-value a:hover {
            border-bottom-color: var(--primary);
            color: #ec4899;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tag {
            display: inline-block;
            background: rgba(153, 69, 255, 0.1);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .tag:hover {
            background: rgba(153, 69, 255, 0.2);
        }

        .navigation {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .nav-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s;
            display: inline-block;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(153, 69, 255, 0.4);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .nav-btn-secondary {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--primary);
        }

        .nav-btn-secondary:hover {
            background: rgba(153, 69, 255, 0.1);
            border-color: var(--primary);
        }

        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
            margin-top: 3rem;
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        .date-display {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-top: 1rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            header h1 {
                font-size: 1.75rem;
            }

            .metadata {
                padding: 1.5rem;
            }

            .navigation {
                grid-template-columns: 1fr;
            }

            .image-container img {
                max-height: 400px;
            }
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        .empty-state h2 {
            color: var(--text);
            margin-bottom: 1rem;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header>
        <h1>🎵 Daily Miku</h1>
        <p>Beautiful Hatsune Miku artwork every day</p>
    </header>

    <div class="container">
        {% block content %}{% endblock %}

        <footer>
            <p>Part of <a href="/">daily-miku-base</a> • <a href="/api/stats">Stats</a></p>
        </footer>
    </div>
</body>
</html>
