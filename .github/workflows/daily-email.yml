name: Daily Miku Email

on:
  schedule:
    # Run every day at 04:00 UTC (12:00 PM Beijing time, UTC+8)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to send (YYYY-MM-DD, leave empty for today)'
        required: false
        type: string

jobs:
  send_daily_email:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e .

      - name: Send daily email
        env:
          RAINDROP_TOKEN: ${{ secrets.RAINDROP_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DAILY_MIKU_OPERATOR: github-actions
          DAILY_MIKU_EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          DAILY_MIKU_EMAIL_RECIPIENTS: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          source .venv/bin/activate
          if [ -n "${{ github.event.inputs.date }}" ]; then
            daily-miku email send --date ${{ github.event.inputs.date }} --json
          else
            daily-miku email send --json
          fi

      - name: Log result
        if: always()
        run: echo "Daily Miku email sent"
