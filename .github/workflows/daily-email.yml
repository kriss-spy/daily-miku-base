name: Daily Miku Email

on:
  schedule:
    # Primary: 02:00 UTC = 10:00 AM UTC+8 (Asia timezone)
    - cron: '0 2 * * *'
    # Retry: 14:00 UTC = 10:00 PM UTC+8 (fallback if morning send failed)
    - cron: '0 14 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  send_daily_email:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      
      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e .
      
      - name: Send daily email
        env:
          RAINDROP_TOKEN: ${{ secrets.RAINDROP_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          source .venv/bin/activate
          daily-miku send-email
      
      - name: Log workflow info
        if: always()
        run: |
          echo "=== Daily Miku Email Workflow ==="
          echo "Run Time (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "Asia Time (UTC+8): $(date -d '+8 hours' '+%Y-%m-%d %H:%M:%S')"
          echo "Cron Schedule: 02:00 UTC (10 AM UTC+8) and 14:00 UTC (10 PM UTC+8)"
          echo "=== End Workflow ===="
